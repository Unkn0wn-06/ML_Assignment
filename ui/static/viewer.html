<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cooling RL replay</title><style>{{viewer.css}}</style>
<main><nav aria-label="Viewer tools"><strong class="brand"><i></i>Cooling RL</strong><button id="home" title="Reset camera" aria-label="Reset camera">⌂</button><button id="legendToggle" title="Toggle legends" aria-label="Toggle legends">▤</button><button id="inspect" title="Toggle inspector" aria-label="Toggle inspector">ⓘ</button></nav>
<section id="stage"><div id="room"></div><div id="loop" hidden></div><div class="mode" aria-label="Scene view"><button>3D</button><button>PLAN</button><button>LOOP</button></div><header id="meta"></header><div class="caption" id="caption"></div><div id="markers"></div><div id="zone" hidden></div><div id="keys"></div></section>
<aside id="panel"><header><b id="title"></b><button id="close" aria-label="Close inspector">×</button></header><article id="info"></article></aside>
<footer><label><input id="replay" type="checkbox" checked> Replay</label><span>Step 0</span><button id="play" aria-label="Play replay">▶</button><input id="step" type="range" min="0" value="0" aria-label="Replay step"><span id="end"></span><label><input id="compare" type="checkbox"> Compare</label><select id="speed" aria-label="Playback speed"><option>0.5×</option><option selected>1×</option><option>2×</option><option>4×</option></select></footer></main>
<script id="payload" type="application/json">{{payload}}</script><script>{{three.min.js}}</script><script>{{room.js}}</script><script>{{loop.js}}</script><script>{{viewer.js}}</script></html>
