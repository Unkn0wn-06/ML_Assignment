[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-centre-rl"
version = "0.1.0"
description = "Data-driven reinforcement learning for energy-efficient data-centre cooling"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "gymnasium>=0.29"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
deep-rl = ["stable-baselines3>=2.3"]
ui = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

